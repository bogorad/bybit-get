name: Linux AMD64

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Check package and Home Manager module
        run: nix flake check --no-update-lock-file --print-build-logs
      - name: Build static executable
        run: nix build --no-update-lock-file .#bybit-get-static --out-link result-static
      - name: Stage executable
        run: install -Dm755 result-static/bin/bybit-get dist/bybit-get
      - name: Check safe default behavior
        env:
          BYBIT_API_KEY_FILE: /nonexistent/bybit-test-key
          BYBIT_API_SECRET_FILE: /nonexistent/bybit-test-secret
          BYBIT_BASE_URL: http://invalid.example
        run: |
          dist/bybit-get > dist/default-help.txt || exit "$?"
          dist/bybit-get --help > dist/explicit-help.txt || exit "$?"
          cmp dist/default-help.txt dist/explicit-help.txt || exit "$?"
          dist/bybit-get --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bybit-get-linux-x86_64
          path: dist/bybit-get
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
