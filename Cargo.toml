[package]
name = "bybit-get"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Read Bybit Card transaction events through the official API"
repository = "https://github.com/bogorad/bybit-get"

[dependencies]
hmac = "0.12.1"
reqwest = { version = "0.12.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = { version = "1.0.135", features = ["arbitrary_precision", "raw_value"] }
sha2 = "0.10.8"
signal-hook = "0.3.18"
toml = "0.8.19"
url = "2.5.4"
